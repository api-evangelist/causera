name: Causera
description: 'Causera was an early-stage Palo Alto, California startup surfaced as a
  500 Global (500 Startups) portfolio company. Enrichment probing found no operating
  public surface: the company''s own domain, causera.com, resolves to a GoDaddy parked-domain
  lander rather than a product site, and the only verified live property is the dormant
  "Causera Engineering" GitHub organization (github.com/causera, created 2011-06-22),
  which holds a single public repository — a fork of mbleigh/princely, a Rails wrapper
  for the PrinceXML PDF library — last pushed in August 2011 with no public members.
  Causera therefore appears to be a defunct 2011-era company with no developer portal,
  no documentation, no API, and no published specifications. This profile records the
  negative result so future enrichment rounds do not re-probe from scratch.'
